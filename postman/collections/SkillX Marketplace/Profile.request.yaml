$kind: http-request
method: POST
url: '{{baseUrl}}/profile'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "wallet_address": "{{walletAddress}}",
      "role": "freelancer",
      "skills": ["javascript", "react"],
      "name": "Example Freelancer",
      "bio": "Builds reliable web applications.",
      "portfolio": "https://example.com"
    }
